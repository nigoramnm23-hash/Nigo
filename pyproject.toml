[project]
name = "bnpl-intelligence"
version = "1.0.0"
description = "Predicting Buy Now, Pay Later use among US adults (SHED 2025)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "streamlit==1.67.0",
    "joblib",
    "shap==0.54.1",
    "nbformat",
    "nbclient==0.11.0",
    "ipykernel",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
